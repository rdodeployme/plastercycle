name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      # Project sites live under /<repo>/. If a custom domain is added (CNAME), build at the root instead.
      - name: Build
        run: |
          if [ -f public/CNAME ]; then
            export SITE_URL="https://$(cat public/CNAME)"
            export BASE_PATH="/"
          else
            export SITE_URL="${{ steps.pages.outputs.origin }}"
            export BASE_PATH="${{ steps.pages.outputs.base_path }}/"
          fi
          echo "Building for $SITE_URL$BASE_PATH"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
